# nixpacks.toml
[phases.setup]
nixPkgs = ["nodejs-20", "python3"]

[phases.install]
cmds = [
  "npm ci --omit=dev --prefer-offline --no-audit --no-fund --loglevel=warn",
  "npm run db:generate"
]

[phases.build]
cmds = []

[phases.deploy]
cmds = ["npm run db:deploy"]

[environment]
NODE_ENV = "production"
NPM_CONFIG_LOGLEVEL = "warn"
NPM_CONFIG_FUND = "false"
NPM_CONFIG_AUDIT = "false"
NPM_CONFIG_PREFER_OFFLINE = "true"
NPM_CONFIG_CACHE_LOCK_STALE = "60000"
NPM_CONFIG_CACHE_LOCK_RETRIES = "3"
NPM_CONFIG_PREFER_OFFLINE = "true"